# Fabrique le .dmg (macOS) et le .exe (Windows), puis les publie dans les Releases.
# Se lance en poussant un tag de version : git tag v0.2.0 && git push origin v0.2.0
# (ou à la main depuis l'onglet Actions, pour tester sans publier).
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Fabrication (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            # Pas de certificat Apple sur GitHub : signature « ad hoc », suffisante pour lancer l'appli.
            args: --mac dmg --arm64 --x64 -c.mac.identity=- -c.mac.hardenedRuntime=false
            files: release/*.dmg
          - label: Windows
            os: windows-latest
            args: --win nsis --x64
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publication de la version
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Télécharger

            - **Windows** : `Jaquette-Master-…-windows-setup.exe`
            - **Mac Apple Silicon (M1, M2, M3…)** : `Jaquette-Master-…-mac-arm64.dmg`
            - **Mac Intel** : `Jaquette-Master-…-mac-x64.dmg`

            ## Premier lancement

            L'appli n'est pas encore signée par Apple ni par Microsoft : le système affiche un avertissement la première fois.

            - **Windows** : « Windows a protégé votre ordinateur » → *Informations complémentaires* → *Exécuter quand même*.
            - **macOS** : ouvre l'appli une fois, puis va dans *Réglages Système › Confidentialité et sécurité* et clique sur *Ouvrir quand même* en bas de la page.
