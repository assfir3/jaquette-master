# Fabrique le .dmg (macOS) et le .exe (Windows), puis les publie dans les Releases.
# Se lance en poussant un tag de version : git tag v0.2.0 && git push origin v0.2.0
# (ou à la main depuis l'onglet Actions, pour tester sans publier).
name: Publication

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Fabrication (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            # .zip : lu par l'appli Mac pour se mettre à jour toute seule.
            files: |
              release/*.dmg
              release/*-mac-*.zip
          - label: Windows
            os: windows-latest
            # latest.yml : lu par l'appli Windows pour se mettre à jour toute seule.
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron

      - name: Fabrication (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Mac : si les secrets Apple sont renseignés (voir docs/signature-mac.md), l'appli est signée
      # avec le certificat Developer ID et notarisée par Apple (plus d'avertissement au lancement).
      # Sinon, signature « ad hoc », suffisante pour lancer l'appli après un avertissement.
      - name: Fabrication (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "Signature Developer ID et notarisation Apple"
            export CSC_LINK="$MAC_CERT_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            npx electron-builder --mac dmg zip --arm64 --x64 --publish never
          else
            echo "Pas de certificat Apple : signature ad hoc"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg zip --arm64 --x64 \
              -c.mac.identity=- -c.mac.hardenedRuntime=false --publish never
          fi

      # Test de lancement : installe l'appli comme un utilisateur, l'ouvre, vérifie l'interface
      # et la recherche de jeux (JAQUETTE_SMOKE_TEST), puis la désinstalle.
      - name: Test de l'appli installée (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem release/*-windows-setup.exe | Select-Object -First 1
          Start-Process -Wait -FilePath $setup.FullName -ArgumentList '/S', '/D=C:\JaquetteMaster'
          $exe = 'C:\JaquetteMaster\Jaquette Master.exe'
          if (-not (Test-Path $exe)) { throw "Appli non installée : $exe introuvable" }
          $env:JAQUETTE_SMOKE_TEST = "$env:RUNNER_TEMP\smoke.json"
          $p = Start-Process -PassThru -Wait -FilePath $exe
          Get-Content $env:JAQUETTE_SMOKE_TEST
          if ($p.ExitCode -ne 0) { throw "Test de lancement échoué (code $($p.ExitCode))" }
          $uninstall = Get-ChildItem 'C:\JaquetteMaster\Uninstall*.exe' | Select-Object -First 1
          Start-Process -Wait -FilePath $uninstall.FullName -ArgumentList '/S'

      - name: Test de l'appli installée (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls release/*-mac-arm64.dmg | head -1)
          mnt=$(hdiutil attach -nobrowse "$dmg" | tail -1 | cut -f3-)
          cp -R "$mnt/Jaquette Master.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          app="$RUNNER_TEMP/Jaquette Master.app"
          codesign --verify --deep --strict "$app" && echo "Signature valide"
          spctl --assess --type execute -v "$app" || echo "(non notarisée : avertissement au premier lancement)"
          JAQUETTE_SMOKE_TEST="$RUNNER_TEMP/smoke.json" "$app/Contents/MacOS/Jaquette Master"
          cat "$RUNNER_TEMP/smoke.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publication de la version
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## Télécharger

            - **Windows** : `Jaquette-Master-…-windows-setup.exe`
            - **Mac Apple Silicon (M1, M2, M3…)** : `Jaquette-Master-…-mac-arm64.dmg`
            - **Mac Intel** : `Jaquette-Master-…-mac-x64.dmg`

            ## Mises à jour

            L'appli prévient quand une nouvelle version sort. Sur Windows, elle se télécharge seule et s'installe en redémarrant ; sur Mac aussi (à partir de la 0.3.1), elle se remplace toute seule au redémarrage.

            ## Premier lancement

            Chaque version est installée et lancée automatiquement sur Windows et sur macOS avant d'être publiée.

            L'appli n'est pas signée par Microsoft (et par Apple tant que la signature n'est pas activée) : le système peut afficher un avertissement la première fois.

            - **Windows** : « Windows a protégé votre ordinateur » → *Informations complémentaires* → *Exécuter quand même*.
            - **macOS** : ouvre l'appli une fois, puis va dans *Réglages Système › Confidentialité et sécurité* et clique sur *Ouvrir quand même* en bas de la page.
