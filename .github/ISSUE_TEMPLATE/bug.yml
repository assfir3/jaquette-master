name: Signaler un bug
description: Quelque chose ne marche pas comme prévu.
labels: [bug]
body:
  - type: textarea
    id: probleme
    attributes:
      label: Que se passe-t-il ?
      description: Décris le problème et ce que tu attendais à la place.
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire ?
      placeholder: |
        1. Chercher « Hades »
        2. Cliquer sur « Créer la jaquette automatiquement »
        3. …
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Quelle version ?
      options:
        - Appli Windows (.exe)
        - Appli macOS (.dmg)
        - Version web (npm run dev)
    validations:
      required: true
  - type: input
    id: numero
    attributes:
      label: Numéro de version
      placeholder: 0.1.0
  - type: textarea
    id: captures
    attributes:
      label: Captures d'écran
      description: Glisse tes images ici.
